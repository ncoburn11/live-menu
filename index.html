<style>
/* Layout: Flavorade-site look on light lavender. Purple ticker band, two-tone Anton headline, orange pill brand tabs, one brand panel at a time */
:root{

  color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
.ticker{background:var(--purple);color:var(--orange);overflow:hidden;white-space:nowrap;border-bottom:3px solid var(--deep)}
.ticker .track{display:inline-flex;gap:48px;padding-block:10px;animation:tick 30s linear infinite;font-family:var(--label);font-size:20px;letter-spacing:.08em}
.ticker .track span::after{content:"\25CF";color:var(--lav);margin-left:48px;font-size:12px;vertical-align:3px}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .track{animation:none}}
.wrap{max-width:940px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}

h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(52px,12vw,104px);line-height:.9;margin:6px 0 0;letter-spacing:-.01em}
h1 .o{color:var(--orange);-webkit-text-stroke:0}
.hgroup{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.live{display:inline-flex;align-items:center;gap:8px;font-family:var(--label);font-size:18px;letter-spacing:.1em;color:#137a3a;background:#e3f6e8;border:1px solid #9bd8ad;border-radius:999px;padding:3px 12px 1px 10px}
.live i{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.6);animation:blink 1.4s ease-in-out infinite;margin-top:-2px}
@keyframes blink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.55)}50%{opacity:.35;box-shadow:0 0 0 6px rgba(34,197,94,0)}}

.tag{font-style:italic;color:var(--muted);margin:10px 0 0}
.cl{background:#fff;border-radius:999px;padding:8px 18px;display:flex;box-shadow:0 2px 0 var(--line)}
.cl img{height:34px;width:auto}
.dist{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:14px}
.tabs{display:flex;flex-wrap:wrap;gap:10px}
.tab{all:unset;cursor:pointer;font-family:var(--label);font-size:22px;letter-spacing:.06em;padding:8px 22px 6px;border-radius:999px;background:var(--card);color:var(--purple);border:2px solid var(--lav);transition:transform .12s}
.tab:hover{transform:translateY(-1px);border-color:var(--purple)}
.tab:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.tab[aria-selected="true"]{background:var(--orange);color:#000;border-color:var(--orange)}
.panel{display:flex;flex-direction:column;gap:18px}
.banner{border-radius:18px;overflow:hidden;background:#fff;border:2px solid var(--lav);display:flex;align-items:center;justify-content:center}
.banner img{width:100%;height:auto;display:block}
.banner.clear{background:transparent;border:0;border-radius:0}
.banner.plate{padding:8px 0;background:transparent;border:0;border-radius:0}
.banner.plate img{width:auto;max-width:100%;max-height:120px}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px}
.ph h2{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(34px,7vw,52px);line-height:1;margin:0}
.ph h2 .o{color:var(--orange)}
.ph .meta{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--purple);font-weight:700}
.rule{width:56px;height:3px;background:var(--orange);border-radius:2px}
.sub{font-family:var(--label);font-size:26px;letter-spacing:.06em;color:var(--purple);margin:6px 0 0}
ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:600px){ol{grid-template-columns:minmax(0,1fr)}}
li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:2.4em minmax(0,1fr);gap:12px;align-items:center}
.rk{font-family:var(--display);font-size:26px;color:var(--orange);line-height:1;font-variant-numeric:tabular-nums}
.nm{font-weight:700;font-size:17px;min-width:0;line-height:1.25}
.co{display:block;font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.02em}
.empty{color:var(--muted);font-style:italic}
li.wiz{position:relative;overflow:hidden;border:2px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(120deg,var(--orange),#d9b8ff,var(--purple),var(--orange)) border-box;background-size:100% 100%,300% 300%;animation:wizb 4s linear infinite}
li.wiz .nm{background:linear-gradient(90deg,var(--deep) 0%,var(--purple) 35%,var(--orange) 50%,var(--purple) 65%,var(--deep) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:wizt 3s linear infinite}
li.wiz .co{color:var(--purple);font-weight:700;-webkit-text-fill-color:var(--purple)}
li.wiz .sp{position:absolute;color:var(--orange);font-size:14px;line-height:1;pointer-events:none;animation:twk 2.2s ease-in-out infinite}
li.wiz .sp:nth-of-type(1){top:6px;right:14px}
li.wiz .sp:nth-of-type(2){bottom:6px;right:44px;font-size:10px;color:var(--purple);animation-delay:.7s}
li.wiz .sp:nth-of-type(3){top:10px;right:70px;font-size:9px;animation-delay:1.4s}
@keyframes wizb{to{background-position:0 0,300% 0}}
@keyframes wizt{to{background-position:-250% 0}}
@keyframes twk{0%,100%{opacity:.15;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
@media (prefers-reduced-motion:reduce){li.wiz,li.wiz .nm,li.wiz .sp{animation:none}li.wiz .nm{color:var(--purple);background:none}li.wiz .sp{opacity:.9}}
li{grid-template-columns:2.4em minmax(0,1fr) auto}
li.picked{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange) inset;background:#fff6e6}

.qty{display:inline-flex;align-items:center;background:#fff;border:2px solid var(--lav);border-radius:999px;overflow:hidden;position:relative;z-index:1}

.qb{all:unset;cursor:pointer;width:30px;height:32px;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--purple);line-height:1}
.qb:hover{background:var(--bg)}
.qb:focus-visible{outline:2px solid var(--purple);outline-offset:-2px}
.qty input{width:42px;height:32px;border:0;text-align:center;font:700 16px var(--body);color:var(--ink);background:transparent;-moz-appearance:textfield;appearance:textfield;padding:0}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.oin{padding:10px 14px;display:flex;flex-direction:column;gap:10px}
.orow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.ohead{display:flex;flex-direction:column;min-width:0}
.otitle{font-family:var(--label);font-size:24px;letter-spacing:.06em;color:var(--orange);line-height:1}
.osum{font-size:13px;color:var(--lav)}
.obtns{display:flex;flex-wrap:wrap;gap:8px}
.ob{all:unset;cursor:pointer;font-family:var(--label);font-size:19px;letter-spacing:.06em;padding:8px 18px 6px;border-radius:999px;background:var(--orange);color:#000}
.ob.ghost{background:transparent;color:#fff;border:2px solid var(--lav);padding:6px 14px 4px}
.ob:focus-visible{outline:3px solid #fff;outline-offset:2px}
.olab{display:block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--lav);margin-bottom:6px;font-weight:700}
#otext{width:100%;box-sizing:border-box;resize:vertical;border-radius:12px;border:0;padding:10px 12px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--card);max-height:40vh}
.omsg{font-size:13px;color:var(--orange);min-height:0}
.omsg:empty{display:none}
.how{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;background:var(--card);border:2px dashed var(--lav);border-radius:14px;padding:8px 14px}
.howt{margin:0;font-family:var(--display);text-transform:uppercase;font-size:20px;line-height:1.1;color:var(--deep)}
.howt span{color:var(--orange)}
.steps{display:flex;flex-wrap:wrap;gap:4px 14px}
.step{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600;font-size:14px}
.step b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--orange);color:#000;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:12px}
.step em{font-style:normal;color:var(--purple);font-weight:700}
.allsec{display:flex;flex-direction:column;gap:12px;padding-top:6px}

.allh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.allh img{height:44px;width:auto;max-width:160px;object-fit:contain}
.allh h3{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:30px;line-height:1;color:var(--deep)}

.fab{all:unset;box-sizing:border-box;cursor:pointer;position:fixed;z-index:30;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-radius:999px;background:var(--orange);color:#000;border:3px solid var(--deep);box-shadow:0 6px 0 var(--deep),0 14px 30px rgba(58,20,88,.35);transition:transform .15s}

.fab:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.fab svg{width:22px;height:29px;flex:none;animation:drip 2.6s ease-in-out infinite;transform-origin:50% 0}
.fab-t{font-family:var(--label);font-size:22px;letter-spacing:.06em;line-height:1;padding-top:2px}
.fab-n{min-width:28px;height:28px;padding:0 6px;border-radius:999px;background:var(--deep);color:var(--orange);display:grid;place-items:center;font-family:var(--display);font-size:16px}
.fab.open .fab-t::after{content:" ▾"}
.fab.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-4deg)}100%{transform:scale(1)}}
@keyframes drip{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg) translateY(1px)}}
.ticket{position:fixed;z-index:29;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 36px));max-height:calc(100vh - 120px);overflow:auto;background:#fffdf7;color:var(--ink);border-radius:6px 6px 14px 14px;padding:26px 18px 18px;box-shadow:0 18px 44px rgba(43,15,69,.35);display:flex;flex-direction:column;gap:10px;transform-origin:100% 100%;animation:tkin .28s cubic-bezier(.2,1.2,.4,1);
  background-image:radial-gradient(circle at 10px 0,transparent 7px,#fffdf7 7.5px);background-size:20px 100%;background-repeat:repeat-x;background-position:-10px 0}
@keyframes tkin{from{opacity:0;transform:translateY(16px) rotate(2deg) scale(.96)}to{opacity:1;transform:none}}
.tk-x{all:unset;cursor:pointer;position:absolute;top:10px;right:12px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-size:22px;color:var(--muted)}
.tk-x:hover{background:var(--bg)}
.tk-x:focus-visible{outline:2px solid var(--purple)}
.tk-head{display:flex;flex-direction:column;gap:2px;border-bottom:2px dashed var(--lav);padding-bottom:10px}
.tk-kicker{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--purple);font-weight:700}
.tk-head h3{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:38px;line-height:.95;color:var(--deep)}
.tk-head h3 span{color:var(--orange)}
.tk-sum{font-size:13px;color:var(--muted)}
.tk-lab{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
#otext{width:100%;box-sizing:border-box;resize:none;border:0;padding:4px 0;font:15px/1.6 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:repeating-linear-gradient(transparent 0 23px,var(--line) 23px 24px);background-attachment:local;outline:none}
.tk-copy{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;width:100%;font-family:var(--label);font-size:23px;letter-spacing:.05em;padding:12px 16px 9px;border-radius:999px;background:var(--orange);color:#000;border:3px solid var(--deep);box-shadow:0 4px 0 var(--deep)}
.tk-copy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.tk-copy:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.tk-msg{font-weight:700;color:var(--purple);text-align:center;font-size:14px}
.tk-msg:empty{display:none}
.tk-clear{all:unset;cursor:pointer;align-self:center;font-size:13px;color:var(--muted);text-decoration:underline}
.tk-clear:focus-visible{outline:2px solid var(--purple)}
.burst{position:absolute;left:50%;bottom:120px;width:0;height:0;pointer-events:none}
.burst i{position:absolute;width:10px;height:13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0;animation:fly .9s ease-out forwards}
@keyframes fly{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1)}}
@media (prefers-reduced-motion:reduce){.fab svg,.fab.pop,.ticket{animation:none}}
body{padding-bottom:90px}
.allcopy{display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:6px}
.ac-btn{all:unset;cursor:pointer;font-weight:700;font-size:14px;color:var(--purple);text-decoration:underline;text-underline-offset:3px}
.ac-btn:hover{color:var(--orange)}
.ac-btn:focus-visible{outline:2px solid var(--purple);outline-offset:2px}

footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-width:65ch;border-top:2px solid var(--line);padding-top:16px}
</style>

const ORDER={};try{Object.assign(ORDER,JSON.parse(localStorage.getItem("cl-order")||"{}"))}catch(e){}
const keyOf=(brand,x)=>brand+"|"+x.s+"|"+(x.c||"");
const list=(a,brand)=>a&&a.length?`<ol>${a.map((x,i)=>{const k=keyOf(brand,x),q=ORDER[k]&&ORDER[k].q||0,w=/wizard trees|no till kings/i.test(x.c||"");return `<li class="${w?"wiz":""}${q?" picked":""}" data-k="${esc(k)}">${w?'<span class="sp" aria-hidden="true">✦</span><span class="sp" aria-hidden="true">✦</span><span class="sp" aria-hidden="true">✧</span>':""}<span class="rk">${String(i+1).padStart(2,"0")}</span><span class="nm">${esc(x.s)}${x.c?`<span class="co">x ${esc(x.c)}</span>`:""}</span><span class="qty"><button type="button" class="qb" data-d="-1" aria-label="Less ${esc(x.s)}">−</button><input type="number" inputmode="numeric" min="0" step="1" value="${q||""}" placeholder="0" aria-label="Quantity of ${esc(x.s)}" id="q-${esc(k).replace(/[^a-z0-9]/gi,"_")}"><button type="button" class="qb" data-d="1" aria-label="More ${esc(x.s)}">+</button></span></li>`}).join("")}</ol>`:`<p class="empty">Nothing available right now. Check back after the next refresh.</p>`;
const tabs=document.getElementById("tabs"),panel=document.getElementById("panel");
B.forEach(b=>{const t=document.createElement("button");t.className="tab";t.id="t-"+b.id;t.setAttribute("role","tab");t.textContent=b.name;t.onclick=()=>show(b.id,true);tabs.appendChild(t);});
[ALL].forEach(b=>{const t=document.createElement("button");t.className="tab";t.id="t-"+b.id;t.setAttribute("role","tab");t.textContent=b.name;t.onclick=()=>show(b.id,true);tabs.appendChild(t);});
function brandHTML(b,compact){
  const n=b.parts.reduce((a,p)=>a+(p[1]||[]).length,0);
  const word=b.name.toUpperCase()==="VUZE"?"VUZE":b.name;
  let h="";
  if(compact){
    h+=`<div class="allh">${b.img?`<img src="logos/${b.img}.webp" alt="">`:""}<h3>${esc(word)}</h3><span class="meta">${esc(b.kind)} · ${n} strains</span></div>`;
  }else{
    if(b.img) h+=`<div class="banner${b.plate?" plate":""}${b.clear?" clear":""}"><img src="logos/${b.img}.webp" alt="${esc(b.name)}"></div>`;
    h+=`<div class="ph"><h2>${esc(word)} <span class="o">Menu.</span></h2><span class="meta">${esc(b.kind)} · ${n} strains</span></div><div class="rule"></div>`;
  }
  b.parts.forEach(p=>{
    if(p[2]) h+=compact?`<p class="sub">${esc(p[0])}</p>`:`<div class="banner"><img src="logos/${p[2]}.webp" alt="${esc(b.name+" "+p[0])}"></div><p class="sub">${esc(p[0])}</p>`;
    h+=list(p[1],b.parts.length>1?b.name+" "+(p[0].startsWith("Badder")?"Badder":"All-in-One"):b.name);
  });
  return h;
}
function show(id,push){
  const all=id==="all";
  const b=all?ALL:(B.find(x=>x.id===id)||B[0]);
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.id==="t-"+b.id));
  let h;
  if(all){
    const n=B.reduce((a,x)=>a+x.parts.reduce((c,p)=>c+(p[1]||[]).length,0),0);
    h=`<div class="ph"><h2>All <span class="o">Brands.</span></h2><span class="meta">${B.length} brands · ${n} strains</span></div><div class="rule"></div>`+B.map(x=>`<section class="allsec">${brandHTML(x,true)}</section>`).join("");
  }else h=brandHTML(b,false);
  panel.innerHTML=h;
  if(push){try{history.replaceState(null,"","#"+b.id)}catch(e){}}
}
function setQ(li,q){
  q=Math.max(0,Math.min(9999,Math.floor(+q||0)));const k=li.dataset.k;
  const [brand,s,c]=k.split("|");
  if(q){ORDER[k]={q,brand,s,c,t:ORDER[k]&&ORDER[k].t||Date.now()}}else delete ORDER[k];
  li.classList.toggle("picked",!!q);const inp=li.querySelector("input");if(+inp.value!==q)inp.value=q||"";
  save();bar();
}
function save(){try{localStorage.setItem("cl-order",JSON.stringify(ORDER))}catch(e){}}
panel.addEventListener("click",e=>{const b=e.target.closest(".qb");if(!b)return;const li=b.closest("li");setQ(li,(+li.querySelector("input").value||0)+(+b.dataset.d));});
panel.addEventListener("input",e=>{if(e.target.matches(".qty input"))setQ(e.target.closest("li"),e.target.value);});
const BRANDS=["Flavorade","VUZE","Sirius Badder","Sirius All-in-One","Casual"];
function orderText(){
  const items=Object.values(ORDER);if(!items.length)return"";
  const parts=[];BRANDS.forEach(br=>{const its=items.filter(x=>x.brand===br);if(!its.length)return;
    const src=br==="Sirius Badder"?M["Sirius Badder"]:br==="Sirius All-in-One"?M["Sirius AiO"]:M[br]||[];
    const pos=x=>{const i=src.findIndex(y=>y.s===x.s&&(y.c||"")===(x.c||""));return i<0?999:i};
    its.sort((a,b)=>pos(a)-pos(b));
    parts.push(br.toUpperCase()+"\n"+its.map(x=>`${x.q} - ${x.s}${x.c?` (${x.c})`:""}`).join("\n"));});
  return parts.join("\n\n");
}
const fab=document.getElementById("ofab"),tk=document.getElementById("oticket"),otext=document.getElementById("otext"),osum=document.getElementById("osum"),omsg=document.getElementById("omsg"),ocount=document.getElementById("ocount");
let lastN=0;
function openTk(v){tk.hidden=!v;fab.setAttribute("aria-expanded",String(v));fab.classList.toggle("open",v);}
function bar(){const items=Object.values(ORDER),u=items.reduce((a,x)=>a+x.q,0);
  fab.hidden=!items.length;if(!items.length)openTk(false);
  ocount.textContent=items.length;
  if(items.length>lastN){fab.classList.remove("pop");void fab.offsetWidth;fab.classList.add("pop");}
  lastN=items.length;
  osum.textContent=`${items.length} strain${items.length===1?"":"s"} · ${u} total`;
  otext.value=orderText();otext.rows=Math.min(14,Math.max(3,otext.value.split("\n").length));omsg.textContent="";}
fab.addEventListener("click",()=>openTk(tk.hidden));
document.getElementById("oclose").addEventListener("click",()=>openTk(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape")openTk(false);});
function burst(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const box=document.getElementById("oburst");box.innerHTML="";
  for(let i=0;i<16;i++){const d=document.createElement("i");const a=(Math.PI*2*i)/16,r=70+Math.random()*50;
    d.style.setProperty("--x",Math.cos(a)*r+"px");d.style.setProperty("--y",Math.sin(a)*r-30+"px");d.style.setProperty("--r",(Math.random()*120-60)+"deg");
    d.style.background=i%3?"var(--purple)":"var(--orange)";d.style.animationDelay=(Math.random()*.08)+"s";box.appendChild(d);}
  setTimeout(()=>box.innerHTML="",1200);}
document.getElementById("ocopy").addEventListener("click",()=>{const t=otext.value;
  const done=()=>{omsg.textContent="Copied! Paste it in a text to your rep.";burst();};
  const fall=()=>{otext.focus();otext.select();omsg.textContent="It's selected. Tap Copy on your keyboard or phone.";};
  try{navigator.clipboard.writeText(t).then(done,fall)}catch(e){fall()}});
document.getElementById("oclear").addEventListener("click",()=>{Object.keys(ORDER).forEach(k=>delete ORDER[k]);save();document.querySelectorAll("li.picked").forEach(li=>{li.classList.remove("picked");li.querySelector("input").value=""});bar();});
function menuText(){
  const L=[["Flavorade",M["Flavorade"]],["VUZE",M["VUZE"]],["Sirius Badder",M["Sirius Badder"]],["Sirius All-in-One",M["Sirius AiO"]],["Casual",M["Casual"]]];
  return L.filter(x=>x[1]&&x[1].length).map(([b,a])=>b.toUpperCase()+"\n"+a.map(x=>x.s+(x.c?` (${x.c})`:"")).join("\n")).join("\n\n");
}
document.getElementById("acopy").addEventListener("click",()=>{const t=menuText(),msg=document.getElementById("amsg"),ta=document.getElementById("atext");
  const done=()=>{msg.textContent="Whole menu copied! Paste it anywhere.";ta.hidden=true;};
  const fall=()=>{ta.value=t;ta.hidden=false;ta.focus();ta.select();msg.textContent="It's selected. Tap Copy on your keyboard or phone.";};
  try{navigator.clipboard.writeText(t).then(done,fall)}catch(e){fall()}});
const start=(location.hash||"").slice(1).toLowerCase();
show(start==="all"||B.some(b=>b.id===start)?start:"flavorade",false);
bar();
</script>
</body>
</html>
